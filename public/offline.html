<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Offline · Lanka Voyage</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            background: #0f766e;
            color: #fff;
            text-align: center;
            padding: 24px;
        }

        .box {
            max-width: 420px;
        }

        img {
            width: 96px;
            height: 96px;
            border-radius: 24px;
        }

        h1 {
            font-size: 26px;
            margin: 16px 0 4px;
        }

        p {
            margin: 6px 0;
            opacity: .92;
            line-height: 1.5;
        }

        button {
            margin-top: 20px;
            padding: 12px 28px;
            border: 0;
            border-radius: 999px;
            background: #f5c04a;
            color: #10302f;
            font-weight: 700;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="box">
        <img src="/icons/icon-192.png" alt="" />
        <h1>You're offline</h1>
        <p>Check your internet connection and try again.</p>
        <p>ඔබ අන්තර්ජාලයෙන් විසන්ධි වී ඇත. සම්බන්ධතාව පරීක්ෂා කර නැවත උත්සාහ කරන්න.</p>
        <p>நீங்கள் ஆஃப்லைனில் உள்ளீர்கள். இணைய இணைப்பைச் சரிபார்த்து மீண்டும் முயலவும்.</p>
        <button onclick="location.reload()">Retry · නැවත · மீண்டும்</button>
    </div>
</body>

</html>
